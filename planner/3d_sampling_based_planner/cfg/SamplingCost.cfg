#!/usr/bin/env python
# Dynamic reconfigure for the state-aware sampling planner.
# Exposed per-instance; each sampling_planner_state_node manages its own server.
#
# Cost term additions here also require matching self.w_* handling inside
# node/sampling_planner_state_node.py (see _weight_cb and _build_cost_weight_dict).

PACKAGE = "sampling_based_planner_3d"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t, bool_t, int_t

gen = ParameterGenerator()

# --- Core cost weights (free to extend per state) -------------------------------------------------
gen.add("raceline_weight",   double_t, 0, "Lateral offset from raceline (d - d_raceline)^2",                   0.1,    0.0, 10000.0)
gen.add("velocity_weight",   double_t, 0, "Speed tracking vs raceline ((V - V_raceline)/V_raceline)^2",        100.0,  0.0, 10000.0)
gen.add("prediction_weight", double_t, 0, "Opponent prediction avoidance (exp Gaussian kernel)",              5000.0,  0.0, 100000.0)
gen.add("continuity_weight", double_t, 0, "Penalty on L2 deviation from previous tick best (0 to disable)",   50.0,   0.0, 10000.0)
gen.add("boundary_weight",   double_t, 0, "Soft-penalty for |n| near track half-width (0 to disable)",         0.0,    0.0, 10000.0)

# --- Phase 2: mode-aware overtake (side / progress / safety / hysteresis) ------------------------
# ### HJ : _weight_cb 가 매 init 콜백에서 이 필드들을 읽음 → 반드시 .cfg 에 선언돼 있어야 함.
gen.add("safety_margin_m",   double_t, 0, "Track-edge keep-out band inside the half-width [m]",               0.15,   0.0, 1.0)
gen.add("side_weight",       double_t, 0, "Mode-targeted endpoint-n penalty (n_end - target_n)^2",            100.0,  0.0, 10000.0)
gen.add("progress_weight",   double_t, 0, "OT progress reward (negative cost on Sigma s over horizon)",       5.0,    0.0, 1000.0)
gen.add("opp_pred_ttl_s",    double_t, 0, "Drop opponent prediction older than [s]",                          0.5,    0.05, 5.0)
gen.add("hysteresis_ttl_s",  double_t, 0, "Mode lock minimum duration [s]",                                   1.0,    0.0, 10.0)
gen.add("hysteresis_margin", double_t, 0, "Required relative cost improvement to switch mode",                0.3,    0.0, 1.0)
gen.add("kappa_dot_max",     double_t, 0, "Curvature rate limit for PPC sanity warn",                         5.0,    0.1, 100.0)
gen.add("detour_weight",     double_t, 0, "Sigma (n - n_raceline)^2 over horizon (가성비: 너무 돌면 손해)",      0.0,    0.0, 1000.0)
gen.add("endpoint_chi_raceline_only", bool_t, 0, "Endpoint heading 을 raceline tangent 로 고정 (boundary 노이즈 면역)", True)

# --- Sampling grid / horizon / safety (forwarded into calc_trajectory each tick) -----------------
gen.add("horizon",           double_t, 0, "Local trajectory horizon [s]",                                     2.0,    0.2, 10.0)
gen.add("num_samples",       int_t,    0, "Time steps along the trajectory",                                  30,     5,   200)
gen.add("n_samples",         int_t,    0, "Lateral n samples per endpoint",                                   11,     1,   51)
gen.add("v_samples",         int_t,    0, "Endpoint velocity samples",                                        5,      1,   21)
gen.add("safety_distance",   double_t, 0, "Hard ego/opponent keep-out distance [m]",                          0.20,   0.0, 2.0)
gen.add("gg_abs_margin",     double_t, 0, "Absolute gg-diagram margin [m/s^2]",                               0.0,    0.0, 20.0)
gen.add("gg_margin_rel",     double_t, 0, "Relative gg-diagram margin (rebuilds GGManager on change)",        0.0,    0.0, 1.0)
gen.add("friction_check_2d", bool_t,   0, "Force 2D friction check (ignore 3D inclination)",                  False)
gen.add("s_dot_min",         double_t, 0, "Floor on s_dot used for sampling [m/s]",                           1.5,    0.0, 10.0)
gen.add("kappa_thr",         double_t, 0, "Reject candidates whose |kappa| exceeds this [1/m]",               1.5,    0.1, 10.0)
gen.add("relative_generation", bool_t, 0, "Generate samples around current state (vs absolute frame)",        True)

# --- Tick-to-tick smoothing -----------------------------------------------------------------------
# 1-pole EMA on best-selected (d, V) between ticks; 1.0 = no filtering (pure instantaneous argmin),
# 0.0 = frozen on previous tick. Applied AFTER cost-based selection / MPPI blend.
gen.add("filter_alpha",      double_t, 0, "1-pole EMA on (d,V) vs previous tick (1=no filter, 0=frozen)",     0.6,    0.0, 1.0)

# --- MPPI-style blended selection ------------------------------------------------------------------
gen.add("mppi_enable",          bool_t,   0, "Use MPPI weighted blending instead of pure argmin",             False)
gen.add("mppi_temperature",     double_t, 0, "Softmax temperature (relative to cost spread; lower=peaked)",   0.25,  0.01, 5.0)
gen.add("mppi_temporal_weight", double_t, 0, "Extra penalty on deviation from previous blended trajectory",   0.0,   0.0,  10000.0)

# --- Output resampling ----------------------------------------------------------------------------
gen.add("resample_enable",   bool_t,   0, "Resample output waypoints to uniform arc-length spacing",           True)
gen.add("resample_ds_m",     double_t, 0, "Uniform arc-length spacing for output (meters)",                    0.1,    0.02, 1.0)

# --- YAML save / reset triggers (pattern from dynamic_statemachine_server.py) ---------------------
# Both are treated as one-shot triggers: the node resets them to False right after acting.
gen.add("save_params",       bool_t,   0, "One-shot: write current params to the instance YAML and flip off",  False)
gen.add("reset_params",      bool_t,   0, "One-shot: reload the instance YAML into rqt and flip off",          False)

exit(gen.generate(PACKAGE, PACKAGE, "SamplingCost"))
