rate_hz: 30.0
frame_id: map
horizon: 1.2
num_samples: 15
n_samples: 11
v_samples: 5
safety_distance: 0.3
gg_abs_margin: 0.0
gg_margin_rel: 0.0
friction_check_2d: false
s_dot_min: 2.5
kappa_thr: 1.5
relative_generation: true
cost:
  # ### HJ : Option C (per-tick min-max norm × weight) — 각 항이 [0, w] 범위.
  # raceline 은 follow mode 핵심, prediction 은 충돌 회피 핵심, continuity 는
  # mode 안 jitter 억제용. side > prediction 이면 OT 양보로 기우니 prediction 우선.
  raceline_weight: 30.0
  velocity_weight: 50.0
  prediction_weight: 150.0
  continuity_weight: 40.0
  boundary_weight: 60.0
  safety_margin_m: 0.15
  side_weight: 300.0   # ### HJ : 80 → 300 (A/B 검증: 80 은 base term 합에 묻혀 endpoint n swing 너무 작음)
  progress_weight: 5.0  # ### HJ : 25 → 5 (auto-reward 가 OT mode 에 항상 -progress 만큼 가산되어 mode bias)
  detour_weight: 0.0   # ### HJ : 가성비 (Σ(n - n_rl)² · dt). 0=비활성. 1000 검증: follow 비율 16%→83%, OT 채택 시 n_end commit 강해짐. 일단 0, 실차 따라 200~500 시도
  opp_pred_ttl_s: 0.5
endpoint_chi_raceline_only: true  # ### HJ : L1 fix - kill wall-tangent interp wobble at endpoint chi/n_ddot
hysteresis:
  ttl_s: 0.6
  margin: 0.05
  kappa_dot_max: 5.0
filter_alpha: 0.6   # ### HJ : L2 fix - EMA on (d,V) to kill tick-to-tick endpoint jumps (was 1.0 off)
mppi:
  enable: false     # ### HJ : MPPI blend off (cost-가중평균이 mode/detour 차이를 평균화시킴 → 순수 best argmin 사용)
  temperature_rel: 0.3
  temporal_weight: 30.0
resample_enable: true
resample_ds_m: 0.1
ot_side_default: right
